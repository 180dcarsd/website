<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin setup</title>
<style>
body{margin:0;background:#0b0b0c;color:#ececec;font:15px/1.45 system-ui,sans-serif}
main{max-width:460px;margin:6vh auto;padding:0 1rem}
h1{font-size:1.3rem} p{color:#9a9aa2;font-size:.9rem}
label{display:block;font-size:.8rem;color:#9a9aa2;margin:.9rem 0 .3rem}
input{width:100%;box-sizing:border-box;background:#0f0f11;border:1px solid #2a2a2e;border-radius:8px;padding:.55rem .7rem;color:inherit;font:inherit}
button{margin-top:1.3rem;width:100%;padding:.65rem;border:0;border-radius:8px;background:#83bc3d;color:#10150a;font-weight:600;font:inherit;font-weight:600;cursor:pointer}
#out{margin-top:1rem;color:#83bc3d;min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>One-time admin setup</h1>
<p>Everything here runs in your browser. Nothing is sent anywhere. It locks your GitHub token with your ID and password and gives you a <b>config.js</b> file for the admin folder.</p>
<label>GitHub user or organisation</label><input id="owner" placeholder="your-username">
<label>Repository name</label><input id="repo" placeholder="website">
<label>Branch</label><input id="branch" value="main">
<label>GitHub token (fine-grained, this repo only, Contents: read and write)</label><input id="token" type="password" autocomplete="off">
<label>Admin ID</label><input id="id" autocomplete="off">
<label>Admin password (12+ characters; a few random words is best)</label><input id="pw" type="password" autocomplete="new-password">
<button id="go">Make config.js</button>
<div id="out"></div>
</main>
<script>
function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
document.getElementById('go').onclick=async function(){
  var g=function(i){return document.getElementById(i).value.trim();}, out=document.getElementById('out');
  var owner=g('owner'),repo=g('repo'),branch=g('branch'),token=g('token'),id=g('id'),pw=document.getElementById('pw').value;
  if(!owner||!repo||!branch||!token||!id){out.style.color='#e5534b';out.textContent='Fill every box.';return;}
  if(pw.length<12){out.style.color='#e5534b';out.textContent='Password needs 12 or more characters.';return;}
  out.style.color='#83bc3d';out.textContent='Working…';
  var enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
  var km=await crypto.subtle.importKey('raw',enc.encode(id+':'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify({token:token}))));
  var cfg={owner:owner,repo:repo,branch:branch,iter:iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
  var text='window.CMS_CONFIG = '+JSON.stringify(cfg,null,1)+';\n';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));a.download='config.js';a.click();
  out.textContent='Done. Put the downloaded config.js in the admin folder, replacing the empty one.';
};
</script>
</body>
</html>
